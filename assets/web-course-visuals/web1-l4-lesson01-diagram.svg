<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="終了時刻から残り時間を計算する"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4387b9"/></marker></defs><rect width="640" height="440" rx="16" fill="white"/><g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif"><rect x="16" y="16" width="608" height="58" rx="12" fill="#204578" stroke="#204578" stroke-width="2"/><text x="32" y="53" fill="white" font-size="25" text-anchor="start"><tspan x="32" dy="0">終了時刻から残り時間を計算する</tspan></text><rect x="45" y="144" width="550" height="80" rx="14" fill="#e5f4e9" stroke="#c3dfcd" stroke-width="2"/><text x="320" y="194" fill="#216a50" font-size="26" text-anchor="middle"><tspan x="320" dy="0">得点できる時間</tspan></text><path d="M64 262 L581 262" fill="none" stroke="#4387b9" stroke-width="3" marker-end="url(#arrow)"/><path d="M68 248 V278" stroke="#204578" stroke-width="3"/><text x="68" y="316" fill="#233956" font-size="24" text-anchor="middle"><tspan x="68" dy="0">0秒</tspan></text><path d="M318 248 V278" stroke="#204578" stroke-width="3"/><text x="318" y="316" fill="#233956" font-size="24" text-anchor="middle"><tspan x="318" dy="0">5秒</tspan></text><path d="M568 248 V278" stroke="#204578" stroke-width="3"/><text x="568" y="316" fill="#233956" font-size="24" text-anchor="middle"><tspan x="568" dy="0">10秒</tspan></text><text x="68" y="360" fill="#204578" font-size="22" text-anchor="middle"><tspan x="68" dy="0">開始</tspan></text><text x="430" y="360" fill="#204578" font-size="22" text-anchor="middle"><tspan x="430" dy="0">終了：以後は加点しない</tspan></text></g></svg>